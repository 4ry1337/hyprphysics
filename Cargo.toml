[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later" 
authors = ["Rakhat Yskak <yskak.rakhat@gmail.com>"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
actix-web = "4"

# TEMPLATES
tera = "2.3"

# DATABASE
sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-native-tls" ] }

# TIME
jiff = { version = "0.2", features = ["serde"] }

# ERROR
thiserror = "2"
anyhow = "1"

# PARSING
serde = "1"

# TRACING
tracing = "0.1"
tracing-actix-web = "0.7"

# DOCS
utoipa = "5.5"

[dev-dependencies]
criterion = "0.8"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
